<!DOCTYPE html><html lang="ru"><head>
    <meta charset="utf-8" />
    <title>Zeus Simulator 2D</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <style>
        /* ─────────────── ШРИФТ ─────────────── */
        @font-face {
            font-family: 'Ithaca';
            src: url('fonts/Ithaca.ttf') format('truetype');
            font-display: swap;
        }

        html, body {
            margin:0; padding:0;
            width:100%; height:100%;
            overflow:hidden;
            background:#0a0f24;
            font-family: 'Ithaca', sans-serif;
            color:#fff;
        }

        #map {
            width:100vw;
            height:100vh;
            position:relative;
            overflow:hidden;
        }

        /* ─────────────── КНОПКИ ─────────────── */
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 2000;
            display: flex;
            gap: 12px;
        }

        .btn {
            width: 140px;
            height: 48px;
            background: url('/ui/button.png') no-repeat center/contain;
            image-rendering: pixelated;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #000;
            user-select: none;
        }

        .btn:hover { filter: brightness(1.2); }

        /* ─────────────── СТАТУС - НЕТ БОТОВ ─────────────── */
        #status {
            position:absolute;
            left: 10px;
            top: 70px;
            font-size: 18px;
            color: #ffd54f;
            text-shadow: 0 1px 2px rgba(0,0,0,0.6);
            z-index: 1000;
            display:none;
        }

        /* ─────────────── СООБЩЕНИЕ ПОД ЗЕВСОМ ─────────────── */
        #zeus-message {
            position:absolute;
            left:50%;
            top:80%;
            transform: translateX(-50%);
            font-size:22px;
            color:#ffdf5f;
            text-shadow:0 2px 3px rgba(0,0,0,0.7);
            opacity:0;
            transition: opacity 0.3s;
            pointer-events:none;
            z-index: 99999;
        }

        /* ─────────────── FAITHBAR ─────────────── */
        #faithbar-container {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 200px;
            height: 18px;
            background: #333;
            border-radius: 4px;
            z-index: 3000;
        }

        #faithbar-fill {
            height: 100%;
            width: 50%;
            background: white;
            border-radius: 4px;
            transition: width 0.3s;
        }

        #faith-value {
            position: absolute;
            top: 35px;
            right: 10px;
            font-size: 16px;
            font-weight: bold;
        }

        /* ─────────────── БОТЫ ─────────────── */
        .bot-container {
            position:absolute;
            will-change: transform;
            transition: transform 5s linear;
            width: 60px;
            height: 60px;
            transform-origin: center bottom;
            z-index: 5;
        }

        .name-label {
            position:absolute;
            top:-18px;
            left:50%;
            transform: translateX(-50%);
            font-size:16px;
            color:#4dd0ff;
            text-shadow:0 1px 2px rgba(0,0,0,0.8);
        }

        .sprite {
            width: 48px;
            height: 48px;
            image-rendering: pixelated;
            position:absolute;
            left:50%;
            bottom:0;
            transform:translateX(-50%);
            animation: wobble 0.4s infinite ease-in-out alternate;
        }

        @keyframes wobble {
            from { transform: translateX(-50%) rotate(-3deg); }
            to   { transform: translateX(-50%) rotate(3deg); }
        }

        /* ─────────────── ЭФФЕКТЫ ─────────────── */
        .effect {
            position:absolute;
            left:50%;
            top:-28px;
            transform: translateX(-50%);
            font-size:14px;
            font-weight:bold;
            opacity:1;
            animation: fadeUp 1s ease-out forwards;
        }

        @keyframes fadeUp {
            0%   { opacity:1; transform: translate(-50%,0); }
            100% { opacity:0; transform: translate(-50%,-20px); }
        }

        /* ─────────────── ЗЕВС ─────────────── */
        #zeus {
            width: 350px;
            height: 350px;
            position:absolute;
            left:50%; top:50%;
            transform: translate(-50%,-50%);
            background: url('/models/zeus.png') center/contain no-repeat;
            pointer-events:none;
            z-index: 9999;
            animation: floatZeus 3s ease-in-out infinite;
            image-rendering: pixelated;
        }

        @keyframes floatZeus {
            0%   { transform:translate(-50%,-50%) translateY(-10px); }
            50%  { transform:translate(-50%,-50%) translateY(10px); }
            100% { transform:translate(-50%,-50%) translateY(-10px); }
        }
    </style>
</head>

<body>
<div id="map">
    <div id="zeus"></div>
    <div id="zeus-message"></div>

    <div id="controls">
        <div class="btn" onclick="addBot()">Добавить бота</div>
        <div class="btn" onclick="deleteAllBots()">Удалить всех</div>
        <div class="btn" onclick="enableLightning()">⚡ Молния</div>
    </div>

    <div id="status">Ботов нет</div>

    <div id="faithbar-container"><div id="faithbar-fill"></div></div>
    <div id="faith-value">50</div>
</div>

<script>
    let FAITH = 50;
    let lightningMode = false;
    const botsOnMap = new Set(); // хранит ДИВЫ ботов + их id

    const statusEl = document.getElementById("status");
    const zeusMsg = document.getElementById("zeus-message");
    const map = document.getElementById("map");

    function updateFaith(delta) {
        FAITH = Math.max(0, Math.min(100, FAITH + delta));
        document.getElementById("faithbar-fill").style.width = FAITH + "%";
        document.getElementById("faith-value").textContent = FAITH;
    }

    function getDisplayName(bot) {
        return bot.firstName || bot.name || "Безымянный";
    }

    function showZeusMessage(text) {
        zeusMsg.textContent = text;
        zeusMsg.style.opacity = 1;
        setTimeout(() => zeusMsg.style.opacity = 0, 1200);
    }

    /* ─────────────── ЗАГРУЗКА БОТОВ ─────────────── */
    fetch("/bots/state")
        .then(r => r.json())
        .then(bots => {
            if (bots.length === 0) statusEl.style.display = "block";
            else {
                statusEl.style.display = "none";
                bots.forEach(createBot);
            }
        });

    /* ─────────────── СОЗДАНИЕ БОТА ─────────────── */
    function createBot(botData) {
        statusEl.style.display = "none";

        const container = document.createElement("div");
        container.className = "bot-container";
        container.dataset.id = botData.id; // сохраняем ID из БД

        const label = document.createElement("div");
        label.className = "name-label";
        label.textContent = getDisplayName(botData);

        const sprite = document.createElement("img");
        sprite.className = "sprite";
        sprite.src =
            botData.behavior === "FAITHFUL" ? "/models/faithful.png" :
            botData.behavior === "SINNER"  ? "/models/sinner.png"  :
                                             "/models/neutral.png";

        container.append(label, sprite);
        map.appendChild(container);

        botsOnMap.add(container);

        const W = map.clientWidth;
        const H = map.clientHeight;
        let x = Math.random() * (W - 40);
        let y = Math.random() * (H - 60);

        container.style.transform = `translate(${x}px, ${y}px)`;

        function wander() {
            const step = 35;
            x = Math.max(0, Math.min(W - 40, x + (Math.random()*2 - 1)*step));
            y = Math.max(0, Math.min(H - 60, y + (Math.random()*2 - 1)*step));
            container.style.transform = `translate(${x}px, ${y}px)`;
            setTimeout(wander, 700 + Math.random()*3500);
        }
        setTimeout(wander, 300 + Math.random()*1000);

        function prayOrSin() {
            let delta = 0;
            if (botData.behavior === "FAITHFUL") delta = +1;
            if (botData.behavior === "SINNER")  delta = -1;

            if (delta !== 0) {
                updateFaith(delta);
                const eff = document.createElement("div");
                eff.className = "effect";
                eff.style.color = delta > 0 ? "#00ff7f" : "#ff4444";
                eff.textContent = (delta > 0 ? "+" : "") + delta;
                container.appendChild(eff);
                setTimeout(() => eff.remove(), 1000);
            }
            setTimeout(prayOrSin, 1000 + Math.random()*9000);
        }
        setTimeout(prayOrSin, 1200 + Math.random()*2000);
    }

    /* ─────────────── ДОБАВИТЬ БОТА ─────────────── */
    function addBot() {
        fetch("/bots/create", { method:"POST" })
            .then(r => r.json())
            .then(bot => {
                if (!bot || !bot.id) {
                    showZeusMessage("Новая душа не появилась");
                    return;
                }
                createBot(bot);
            });
    }

    /* ─────────────── УДАЛИТЬ ВСЕХ ─────────────── */
    function deleteAllBots() {
        fetch("/bots/delete-all", { method:"DELETE" })
            .then(() => location.reload());
    }

    /* ─────────────── МОЛНИЯ ─────────────── */
    function enableLightning() {
        lightningMode = true;
        showZeusMessage("Выбери место удара ⚡");
    }

    map.addEventListener("click", e => {
        if (!lightningMode) return;
        lightningMode = false;

        const clickX = e.clientX;
        const clickY = e.clientY;
        const RADIUS = 120;

        showZeusMessage("⚡ Удар молнии!");

        botsOnMap.forEach(bot => {
            const rect = bot.getBoundingClientRect();
            const botX = rect.left + rect.width / 2;
            const botY = rect.top + rect.height / 2;

            const dist = Math.hypot(botX - clickX, botY - clickY);
            if (dist < RADIUS) {
                const id = bot.dataset.id;

                // удалить из БД
                fetch(`/bots/delete/${id}`, { method:"DELETE" })
                     .catch(()=>{});

                // удалить визуально
                bot.remove();
                botsOnMap.delete(bot);
            }
        });

        if (botsOnMap.size === 0) {
            statusEl.style.display = "block";
        }
    });
</script>
</body>
</html>
